<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#0b1118">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .not-found{min-height:70vh;display:grid;place-items:center;text-align:center;padding:72px 24px}
    .not-found-inner{max-width:680px}
    .not-found-code{font-size:clamp(4rem,16vw,9rem);font-weight:800;line-height:1;letter-spacing:-.08em;color:var(--accent,#c8a46a)}
    .not-found h1{margin:20px 0 12px}
    .not-found p{max-width:540px;margin:0 auto 28px;color:var(--muted,#aab2bd)}
    .not-found-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="PAPAUTO — главная">
      <span class="brand-mark">P</span><span class="brand-name">PAPAUTO<span class="brand-dot">.</span><small>АВТОМОБИЛИ ПОД ЗАКАЗ</small></span>
    </a>
  </header>
  <main id="main" class="not-found">
    <div class="not-found-inner">
      <div class="not-found-code" aria-hidden="true">404</div>
      <h1>Такой страницы нет</h1>
      <p>Возможно, адрес изменился или в ссылке есть ошибка. Вернитесь на главную или выберите направление — Япония, Южная Корея или Китай.</p>
      <div class="not-found-actions">
        <a class="button button-primary" href="/">На главную ↗</a>
        <a class="button button-secondary" href="/japan.html">Авто из Японии</a>
        <a class="button button-secondary" href="/korea.html">Авто из Кореи</a>
        <a class="button button-secondary" href="/china.html">Авто из Китая</a>
      </div>
    </div>
  </main>
</body>
</html>
