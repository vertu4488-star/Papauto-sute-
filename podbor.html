<script>
window.addEventListener('error',function(e){
  var box=document.getElementById('surveyStatus');
  if(box&&box.textContent.indexOf('Загружаем')>=0) box.textContent='Ошибка загрузки формы: '+String(e.message||e.target?.src||'script').slice(0,190);
},true);
window.addEventListener('unhandledrejection',function(e){
  var box=document.getElementById('surveyStatus');
  if(box&&box.textContent.indexOf('Загружаем')>=0) box.textContent='Ошибка формы: '+String(e.reason?.message||e.reason||'неизвестно').slice(0,190);
});
</script>
