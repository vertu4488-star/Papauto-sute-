name: Independent uptime checks

# This monitor runs on GitHub-hosted infrastructure without TinyFish or Render cron.
on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/uptime-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papauto-independent-uptime
  cancel-in-progress: false

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify user-facing services and real database readiness
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import time
          import urllib.error
          import urllib.request

          TARGETS = [
              ("PapAuto website", "https://papauto.ru/", None),
              ("PapAuto leads and Neon", "https://papauto-leads.onrender.com/health", "database_connected"),
              ("New iPhone Service website", "https://new-iphone-repair-site.onrender.com/", None),
              ("New iPhone Service public domain", "https://xn----8sbco1afeiieo2a4o.xn--p1ai/", None),
              ("New iPhone Service Telegram application", "https://new-iphone-service.onrender.com/health", ("status", "healthy")),
              ("New iPhone Service CRM and Neon", "https://new-iphone-crm-api-staging.onrender.com/ready", ("status", "ready")),
          ]

          def check(target):
              name, url, required_field = target
              last_error = "unknown"
              for attempt in range(1, 6):
                  try:
                      request = urllib.request.Request(url, headers={
                          "User-Agent": "NewIphoneService-UptimeMonitor/1.0",
                          "Accept": "application/json,text/html",
                      })
                      with urllib.request.urlopen(request, timeout=35) as response:
                          status = response.status
                          body = response.read(50000)
                      if not 200 <= status < 300:
                          raise RuntimeError(f"Unexpected HTTP {status}")
                      if required_field is not None:
                          payload = json.loads(body)
                          field, expected = required_field if isinstance(required_field, tuple) else (required_field, True)
                          if payload.get(field) != expected:
                              raise RuntimeError(f"Health body reports unexpected value for {field}")
                      return name, True, f"HTTP {status} (attempt {attempt})"
                  except (urllib.error.URLError, TimeoutError, ValueError, RuntimeError) as exc:
                      last_error = f"{type(exc).__name__}: {str(exc)[:220]}"
                      if attempt < 5:
                          time.sleep(15)
              return name, False, last_error

          with concurrent.futures.ThreadPoolExecutor(max_workers=len(TARGETS)) as pool:
              results = list(pool.map(check, TARGETS))
          for name, okay, message in results:
              print(f"{'OK' if okay else 'FAIL'}: {name}: {message}")
          if any(not okay for _, okay, _ in results):
              raise SystemExit("At least one service failed health checks after five attempts")
          PY
