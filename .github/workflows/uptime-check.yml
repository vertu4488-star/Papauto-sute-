name: Independent uptime checks

# This monitor runs on GitHub-hosted infrastructure without TinyFish or Render cron.
on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/uptime-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papauto-independent-uptime
  cancel-in-progress: false

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert WWW redirects permanently to canonical non-WWW domains
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          domains = [
              ("www.papauto.ru", "papauto.ru"),
              ("www.xn----8sbco1afeiieo2a4o.xn--p1ai", "xn----8sbco1afeiieo2a4o.xn--p1ai"),
          ]
          for source, target in domains:
              suffix = "/seo-redirect-check?source=monitor"
              request = urllib.request.Request("https://" + source + suffix,
                  headers={"User-Agent": "NewIphoneService-SEORedirectCheck/1.0"})
              try:
                  with opener.open(request, timeout=20) as response:
                      raise AssertionError(f"{source}: expected HTTP 301, got {response.status}")
              except urllib.error.HTTPError as error:
                  actual = error.headers.get("Location", "")
                  expected = "https://" + target + suffix
                  if error.code != 301 or actual != expected:
                      raise AssertionError(
                          f"{source}: expected HTTP 301 to {expected}; got {error.code} to {actual}"
                      ) from None
                  print(f"OK: {source} redirects HTTP 301 to {expected}")
          PY
      - name: Verify user-facing services and real database readiness
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import time
          import urllib.error
          import urllib.request

          TARGETS = [
              ("PapAuto website", "https://papauto.ru/", None),
              ("PapAuto leads and Neon", "https://api.papauto.ru/health", "database_connected"),
              ("PapAuto Telegram configuration", "https://api.papauto.ru/health", "telegram_configured"),
              ("New iPhone Service website", "https://new-iphone-repair-site.onrender.com/", None),
              ("New iPhone Service public domain", "https://xn----8sbco1afeiieo2a4o.xn--p1ai/", None),
              ("New iPhone Service Telegram application", "https://new-iphone-service.onrender.com/health", ("status", "healthy")),
              ("New iPhone Service CRM login domain", "https://crm.xn----8sbco1afeiieo2a4o.xn--p1ai/", None),
              ("New iPhone CRM Windows 7 legacy entry", "https://crm.xn----8sbco1afeiieo2a4o.xn--p1ai/legacy", None),
              ("New iPhone Service CRM and Neon", "https://new-iphone-crm-api-staging.onrender.com/ready", ("status", "ready")),
          ]

          def check(target):
              name, url, required_field = target
              last_error = "unknown"
              # Render free instances can return transient 503 while cold-starting.
              # Keep real 5xx failures visible; allow enough time to recover.
              for attempt in range(1, 9):
                  try:
                      request = urllib.request.Request(url, headers={
                          "User-Agent": "NewIphoneService-UptimeMonitor/1.0",
                          "Accept": "application/json,text/html",
                      })
                      with urllib.request.urlopen(request, timeout=35) as response:
                          status = response.status
                          body = response.read(50000)
                      if not 200 <= status < 300:
                          raise RuntimeError(f"Unexpected HTTP {status}")
                      if required_field is not None:
                          payload = json.loads(body)
                          field, expected = required_field if isinstance(required_field, tuple) else (required_field, True)
                          if payload.get(field) != expected:
                              raise RuntimeError(f"Health body reports unexpected value for {field}")
                      return name, True, f"HTTP {status} (attempt {attempt})"
                  except (urllib.error.URLError, TimeoutError, ValueError, RuntimeError) as exc:
                      last_error = f"{type(exc).__name__}: {str(exc)[:220]}"
                      if attempt < 8:
                          time.sleep(15)
              return name, False, last_error

          with concurrent.futures.ThreadPoolExecutor(max_workers=len(TARGETS)) as pool:
              results = list(pool.map(check, TARGETS))
          for name, okay, message in results:
              print(f"{'OK' if okay else 'FAIL'}: {name}: {message}")
          if any(not okay for _, okay, _ in results):
              raise SystemExit("At least one service failed health checks after eight attempts")
          PY
