name: Expand PapAuto verified model photographs toward 500 cars

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/discover_and_expand_cc0_catalog.py"
      - ".github/workflows/expand-cc0-car-directory.yml"

permissions:
  contents: write

concurrency:
  group: papauto-catalog-writes
  cancel-in-progress: false

jobs:
  discover-license-audit-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout PapAuto catalog
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image and search dependencies
        run: python -m pip install "Pillow>=10,<13" "requests>=2.31,<3"
      - name: Find up to 133 exact-model original photographs under CC0 or commercial-use BY/BY-SA
        run: python -u scripts/discover_and_expand_cc0_catalog.py
      - name: Enforce public photo provenance and quality checks
        run: python -m unittest discover -s tests -p "test_market_model_directory.py" -v
      - name: Commit real images and provenance into main
        run: |
          git config user.name "papauto-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo/*.webp catalog-open-data.js catalog.html photo-credits.html research/approved-cc0-vehicle-sources.json research/cc0-photo-provenance.json research/cc0-expansion-discovery-report.json
          if git diff --cached --quiet; then
            echo "No verified licensed photos to publish"
            exit 0
          fi
          git commit -m "Add verified photo-backed PapAuto model cards with source credits toward 500"
          # Other workflows also publish to main. Rebase instead of force-pushing
          # so licensed image provenance and concurrent site edits are preserved.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Catalog updates safely published"
              exit 0
            fi
            echo "Remote main advanced; refreshing before retry $attempt/5"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Concurrent edits conflict; refusing to overwrite changes"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish after five non-destructive attempts"
          exit 1
