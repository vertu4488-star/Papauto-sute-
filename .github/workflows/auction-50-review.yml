name: Validate exact 50 archival lots before release
on:
  push:
    branches: [review/tokidoki-50-lots-20261119]
    paths: ['.github/workflows/auction-50-review.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pillow pillow-avif-plugin requests
      - name: Prepare fixed archive release and verify each media set
        run: python scripts/prepare_owner_review_50_archive.py
      - name: Test publication and static pages
        run: |
          python scripts/build_static_public.py
          python -m unittest discover -s tests -v
          node --check gallery.js
          node tests/test_survey_all_gallery_lots.cjs
      - name: Verify exact output and commit screened supplier archive only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('render-public')
          rows=json.loads((p/'data/gallery-lots.json').read_text())['lots']
          new=[x for x in rows if x['id'].startswith('japan-archive-20261119-')]
          assert len(rows)==182 and len(new)==50
          for r in new:
              assert len(r['photos'])==2 and r['rights_confirmed'] is False and r['status']=='reference_only'
              for u in r['photos']+[r['inspection_image']]:
                  assert (p/u.lstrip('/')).is_file()
          print('VERIFIED: 182 records, 50 new archive examples, 150 local media')
          PY
          git config user.name "papauto-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/AUCTION_ONLY_GALLERY.md scripts/compile_auction_gallery.py scripts/build_static_public.py scripts/verify_publication_approval.py scripts/publish_lot_search.py tests/test_auction_only_images_policy.py research/owner-approved-50-archive-2026-11-19.json assets/auction/approved/japan-archive-20261119-*.jpg
          git commit -m "Prepare exact 50 owner-authorized reference lots with complete media and tests"
          git push origin HEAD:review/tokidoki-50-lots-20261119
