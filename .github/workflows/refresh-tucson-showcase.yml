name: Refresh PapAuto Tucson model photo with verified attribution
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-tucson-showcase.yml"
permissions:
  contents: write
concurrency:
  group: papauto-catalog-writes
  cancel-in-progress: false
jobs:
  licensed-tucson:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest PapAuto sources
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image verification libraries
        run: python -m pip install "Pillow>=10,<13" "requests>=2.31,<3"
      - name: Import exact verified CC BY-SA Tucson photo
        run: python scripts/refresh_tucson_licensed.py
      - name: Validate 24 photos and attribution
        run: |
          python -m unittest discover -s tests -p "test_visual_showroom.py" -v
          python -m unittest discover -s tests -p "test_market_model_directory.py" -v
          python -m unittest discover -s tests -p "test_showcase_price_quality.py" -v
      - name: Publish locally hosted photo and source credits
        run: |
          git config user.name "papauto-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo/hyundai-tucson-nx4-licensed.webp index.html catalog-open-data.js \
            photo-credits.html research/cc0-photo-provenance.json \
            research/approved-cc0-vehicle-sources.json scripts/build_static_public.py tests/test_visual_showroom.py
          git diff --cached --quiet && exit 0
          git commit -m "Use properly credited clean Hyundai Tucson image instead of snowy photo"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "PapAuto image replacement published"
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Conflicting concurrent change; no force push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          exit 1
