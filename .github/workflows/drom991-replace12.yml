name: Find 12 distinct Japan lots with original photos and sheets
on:
  push:
    branches: ['research/drom991-replace12-20261121']
    paths: ['.github/workflows/drom991-replace12.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/research_drom991_targeted_gap.py
      - uses: actions/upload-artifact@v4
        with:
          name: drom991-replace12-original-photo-sheet-review
          path: drom-replace12-review/
          retention-days: 60
