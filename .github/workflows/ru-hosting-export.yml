name: Export PapAuto static website for RU hosting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ru-hosting-export.yml'
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.xml'
      - '*.txt'
      - 'assets/**'
      - 'data/**'
      - 'content/**'
      - 'scripts/build_static_public.py'

permissions:
  contents: read

concurrency:
  group: papauto-ru-static-export
  cancel-in-progress: true

jobs:
  export-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate public-only website (no source code or secrets)
        run: python scripts/build_static_public.py
      - name: Verify index and public assets
        run: |
          test -f render-public/index.html
          test -f render-public/robots.txt
          test -f render-public/sitemap.xml
          test -f render-public/site-config.js
          test -f render-public/assets/papauto-logo.svg
          grep -q "https://api.papauto.ru" render-public/site-config.js
      - name: Package for Russian web hosting
        uses: actions/upload-artifact@v4
        with:
          name: papauto-ru-hosting
          path: render-public/
          if-no-files-found: error
          retention-days: 14
