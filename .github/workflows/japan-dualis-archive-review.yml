name: PapAuto Dualis J10 archival research only
on:
  push:
    branches: ['review/japan-final-dualis-20261125']
    paths: ['.github/workflows/japan-dualis-archive-review.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/research_japan_dualis_archive_20261125.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-dualis-archive-review
          path: japan-dualis-archive-review/
          retention-days: 14
