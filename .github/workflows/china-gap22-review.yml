name: PapAuto missing China exact supplier models research
on:
  push:
    branches: ['review/china-22-model-gap-20261125']
    paths: ['.github/workflows/china-gap22-review.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/research_china_gap22_20261125.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: china-gap22-private-review
          path: china-gap-review/
          retention-days: 14
