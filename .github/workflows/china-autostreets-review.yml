name: Autostreets 100 vehicle review
on:
  push:
    branches: ['research/china-bulk-review-20261120']
    paths: ['.github/workflows/china-autostreets-review.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright requests pillow beautifulsoup4
      - run: playwright install chromium
      - name: Collect public vehicle records and actual images
        run: |
          python - <<'PY'
          import json,re,io,hashlib,concurrent.futures as cf,collections
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          from playwright.sync_api import sync_playwright
          import html
          from PIL import Image,ImageDraw
          from bs4 import BeautifulSoup
          import requests
          root=Path('autostreets-review');root.mkdir()
          base='https://global.autostreets.com'
          urls=set(); records={}; observed_links=set()
          api=[]
          def capture(resp):
              try:
                  if resp.request.resource_type in ('xhr','fetch') and 'json' in resp.headers.get('content-type',''):
                      data=resp.json()
                      if 'queryVehicleInfo' in resp.url and isinstance(data,dict):
                          for rec in (data.get('data') or {}).get('dataList',[]):
                              if rec.get('avId'):records[str(rec['avId'])]=rec
                      if len(api)<150:api.append({'url':resp.url,'sample':str(data)[:1800]})
                      def walk(x):
                          if isinstance(x,dict):
                              for k,v in x.items():
                                  if k.lower() in ('vehicleid','carid','vehicle_id') and str(v).isdigit():urls.add(base+'/en/used-cars/vehicle/'+str(v))
                                  walk(v)
                          elif isinstance(x,list):
                              for y in x:walk(y)
                      walk(data)
              except Exception:pass
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page()
              page.on('response',capture)
              for path in ('/en/auction','/en/used-cars'):
                  try:
                      page.goto(base+path,wait_until='domcontentloaded',timeout=35000)
                      page.wait_for_timeout(4500)
                      try:page.wait_for_selector('text=View details',timeout=25000)
                      except Exception:pass
                      for idx in range(70):
                          hrefs=page.locator('a[href]').evaluate_all("(a)=>a.map(x=>x.href)")
                          observed_links.update(hrefs)
                          for u in hrefs:
                              if re.search(r'/en/(?:used-cars/vehicle|auction/(?:vehicle|detail))/\d+',u):urls.add(u.split('?')[0])
                          if idx==0:
                              (root/('listing-'+path.split('/')[-1]+'.txt')).write_text(page.locator('body').inner_text()[:20000])
                          nexts=page.locator('button[aria-label*="next" i], [title*="next" i], .el-pagination .btn-next, .ant-pagination-next button, button:has-text("Next")')
                          if not nexts.count():break
                          n=nexts.first
                          if not n.is_enabled():break
                          before=page.locator('body').inner_text()[:2000]
                          n.click(timeout=3000);page.wait_for_timeout(650)
                          if before==page.locator('body').inner_text()[:2000]:break
                  except Exception as e:print('listing',path,str(e)[:250],flush=True)
              print('URLs',len(urls),flush=True)
              (root/'discovery.json').write_text(json.dumps({'urls':sorted(urls),'api':api},ensure_ascii=False))
              print('Catalogue records',len(records),flush=True)
              print('Observed links',sorted(observed_links)[:35],flush=True)
              (root/'records.json').write_text(json.dumps([{k:v for k,v in rec.items() if k not in ('vinCode',)} for rec in records.values()],ensure_ascii=False))
              # Render the detail pages using the listing's auction ID, not its internal vehicle ID.
              eligible=[(i,r) for i,r in records.items() if r.get('starCondition') and r.get('firstPhotoUrl') and (r.get('oilType')=='Electric' or 0<float(r.get('sweptVolume') or 0)<=2) and 2017<=int(r.get('modelYear') or 0)<=2026]
              eligible.sort(key=lambda x: (int(x[1].get('modelYear') or 0),-float(x[1].get('displayMileage') or 0)),reverse=True)
              print('Eligible inspected vehicles',len(eligible),flush=True)
              results=[]; hashes=set(); errors=collections.Counter()
              def examine(page,ident,r):
                  route='/en/auction/vehicle/' if r.get('category')==1 else '/en/used-cars/vehicle/'
                  with page.expect_response(lambda x:'/api/gb/car/detail' in x.url and x.status==200,timeout=10000) as res:
                      page.goto(base+route+ident,wait_until='domcontentloaded',timeout=15000)
                  data=res.value.json().get('data',{})
                  info=data.get('info',{})
                  page.wait_for_selector('text=Odometer',timeout=6000)
                  t=page.locator('body').inner_text()
                  if 'Vehicle not inspected' in t or str(r['vehicleCode']) not in t:return None
                  sections={k:info[k] for k in ('skeleton','facade','interior','mechanical','electric','structure','exterior','engine') if isinstance(info.get(k),dict)}
                  if len(sections)<3:
                      sections={k:v for k,v in info.items() if isinstance(v,dict) and isinstance(v.get('itemInfoList'),list)}
                  if len(sections)<3:return None
                  imgs=page.locator('img').evaluate_all("(a)=>a.map(x=>x.currentSrc||x.src)")
                  def original(u):return re.sub(r'\*\d+\*\d+(?=\.jpg)', '',u)
                  first=r['firstPhotoUrl']
                  urls=list(dict.fromkeys(original(x) for x in imgs if x.startswith('https://images.autostreets.com/group1/')))
                  if not any(first in u for u in urls):return None
                  # The provider displays two full-size exterior pictures before thumbnail and damage photos.
                  full=[x for x in imgs if x.startswith('https://images.autostreets.com/group1/') and '*800*600.jpg' in x]
                  ordered=list(dict.fromkeys(original(x) for x in full[:2]+urls[:6]))
                  pictures=[];hs=[];used=[]
                  for u in ordered:
                      try:
                          response=page.request.get(u.replace('.jpg','*800*600.jpg'),timeout=6000)
                          if not response.ok:continue
                          raw=response.body();im=Image.open(io.BytesIO(raw));im.load();h=hashlib.sha256(raw).hexdigest()
                          if min(im.size)<250 or h in hs or h in hashes:continue
                          pictures.append(im.convert('RGB'));hs.append(h);used.append(response.url)
                          if len(pictures)>=3:break
                      except Exception:continue
                  if len(pictures)<2:return None
                  safe={k:r.get(k) for k in ('vehicleName','modelYear','displayMileageDesc','oilType','sweptVolumeDesc','transmissionType','bodyColor','currentCity','showPrice','unitStr','starCondition','starFacade','starInterior','starSkeleton','starElectric')}
                  price=str(safe['showPrice'] or '')
                  safe['public_price']=price if re.fullmatch(r'[\d,]+(?:\.\d+)?',price) and float(price.replace(',',''))>0 and 'Sign in to place a bid' not in t else None
                  # Preserve all publicly supplied inspection sections; do not invent an original sheet or price.
                  return dict(id=ident,fields=safe,inspection=sections,source=page.url,sha256=hs,photo_urls=used,visual_review_required=True),pictures

