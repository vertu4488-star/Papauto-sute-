name: Autostreets 50 vehicle review
on:
  push:
    branches: ['research/china-bulk-review-20261120']
    paths: ['.github/workflows/china-autostreets-review.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright requests pillow beautifulsoup4
      - run: playwright install chromium
      - name: Collect public vehicle records and actual images
        run: |
          python - <<'PY'
          import json,re,io,hashlib,concurrent.futures as cf,collections
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageDraw
          from bs4 import BeautifulSoup
          import requests
          root=Path('autostreets-review');root.mkdir()
          base='https://global.autostreets.com'
          urls=set(); records={}; observed_links=set()
          api=[]
          def capture(resp):
              try:
                  if resp.request.resource_type in ('xhr','fetch') and 'json' in resp.headers.get('content-type',''):
                      data=resp.json()
                      if 'queryVehicleInfo' in resp.url and isinstance(data,dict):
                          for rec in (data.get('data') or {}).get('dataList',[]):
                              if rec.get('avId'):records[str(rec['avId'])]=rec
                      if len(api)<150:api.append({'url':resp.url,'sample':str(data)[:1800]})
                      def walk(x):
                          if isinstance(x,dict):
                              for k,v in x.items():
                                  if k.lower() in ('vehicleid','carid','vehicle_id') and str(v).isdigit():urls.add(base+'/en/used-cars/vehicle/'+str(v))
                                  walk(v)
                          elif isinstance(x,list):
                              for y in x:walk(y)
                      walk(data)
              except Exception:pass
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page()
              page.on('response',capture)
              for path in ('/en/used-cars','/en/auction'):
                  try:
                      page.goto(base+path,wait_until='domcontentloaded',timeout=35000)
                      page.wait_for_timeout(4500)
                      try:page.wait_for_selector('text=View details',timeout=25000)
                      except Exception:pass
                      for idx in range(70):
                          hrefs=page.locator('a[href]').evaluate_all("(a)=>a.map(x=>x.href)")
                          observed_links.update(hrefs)
                          for u in hrefs:
                              if re.search(r'/en/(?:used-cars/vehicle|auction/(?:vehicle|detail))/\d+',u):urls.add(u.split('?')[0])
                          if idx==0:
                              (root/('listing-'+path.split('/')[-1]+'.txt')).write_text(page.locator('body').inner_text()[:20000])
                          nexts=page.locator('button[aria-label*="next" i], [title*="next" i], .el-pagination .btn-next, .ant-pagination-next button, button:has-text("Next")')
                          if not nexts.count():break
                          n=nexts.first
                          if not n.is_enabled():break
                          before=page.locator('body').inner_text()[:2000]
                          previous=len(records)
                          try:
                              with page.expect_response(lambda r:'/api/gb/car/queryVehicleInfo' in r.url and r.status==200,timeout=10000) as pending:
                                  n.click(timeout=4000)
                              pending.value.json()
                              page.wait_for_timeout(500)
                          except Exception:
                              page.wait_for_timeout(1300)
                          if len(records)==previous:
                              page.wait_for_timeout(1800)
                          if len(records)==previous and before==page.locator('body').inner_text()[:2000]:break
                          if len(records)>=900:break
                  except Exception as e:print('listing',path,str(e)[:250],flush=True)
              print('URLs',len(urls),flush=True)
              (root/'discovery.json').write_text(json.dumps({'urls':sorted(urls),'api':api},ensure_ascii=False))
              print('Catalogue records',len(records),flush=True)
              print('Observed links',sorted(observed_links)[:35],flush=True)
              (root/'records.json').write_text(json.dumps([{k:v for k,v in rec.items() if k not in ('vinCode',)} for rec in records.values()],ensure_ascii=False))
              # Render the detail pages using the listing's auction ID, not its internal vehicle ID.
              eligible=[(i,r) for i,r in records.items() if r.get('starCondition') and r.get('firstPhotoUrl') and r.get('showPrice') not in ('0',0,None,'--') and (r.get('oilType')=='Electric' or 0<float(r.get('sweptVolume') or 0)<=2) and 2017<=int(r.get('modelYear') or 0)<=2026]
              eligible.sort(key=lambda x: (int(x[1].get('modelYear') or 0),-float(x[1].get('displayMileage') or 0)),reverse=True)
              print('Eligible inspected vehicles',len(eligible),flush=True)
              results=[]; hashes=set(); errors=collections.Counter()
              def examine(ident,r):
                  try:
                      with sync_playwright() as q:
                          b=q.chromium.launch(headless=True,args=['--no-sandbox'])
                          pg=b.new_page()
                          detail={}
                          def capture_detail(resp):
                              if resp.url==base+'/api/gb/car/detail' and resp.ok:
                                  try:detail.update(resp.json().get('data') or {})
                                  except Exception:pass
                          pg.on('response',capture_detail)
                          route='auction' if int(r.get('category') or r.get('useType') or 1)==1 else 'used-cars'
                          u=base+'/en/'+route+'/vehicle/'+ident
                          pg.goto(u,wait_until='domcontentloaded',timeout=16000)
                          pg.wait_for_selector('text=Condition Details',timeout=6500)
                          t=pg.locator('body').inner_text()
                          if 'Vehicle not inspected' in t or str(r['vehicleCode']) not in t:return 'uninspected or mismatched'
                          pics=pg.locator('img').evaluate_all("(a)=>a.map(x=>x.getAttribute('src')||'')")
                          first=r['firstPhotoUrl'].rsplit('.',1)[0]
                          pics=[x for x in pics if x.startswith('https://images.autostreets.com/group1/')]
                          if not any(first in x for x in pics):return 'first photo mismatch'
                          # Use actual gallery URLs; the 210*210 thumbnails precede damage photos.
                          gallery=[x for x in pics if '*210*210.' in x]
                          urls=list(dict.fromkeys(x.replace('*210*210.','*800*600.') for x in gallery))
                          if len(urls)<2:return 'gallery missing'
                          pictures=[];hs=[];selected=[]
                          for url in urls[:4]:
                              try:
                                  resp=requests.get(url,timeout=(5,12))
                                  resp.raise_for_status(); raw=resp.content
                                  im=Image.open(io.BytesIO(raw));im.load()
                                  h=hashlib.sha256(raw).hexdigest()
                                  if min(im.size)<300 or h in hs:continue
                                  pictures.append(im.convert('RGB'));hs.append(h);selected.append(url)
                                  if len(pictures)>=3:break
                              except Exception:continue
                          if len(pictures)<2:return 'photo download'
                          info=detail.get('info') or {}
                          sections={}
                          for k,v in info.items():
                              if isinstance(v,dict) and isinstance(v.get('itemInfoList'),list):
                                  sections[k]={kk:vv for kk,vv in v.items() if kk!='itemInfoList'}
                                  sections[k]['itemInfoList']=[{kk:vv for kk,vv in z.items() if kk in ('itemName','isDamage','categoryName','damageDescription','damageType','photoUrlList','damageInfoList','description','damageItemList')} for z in v['itemInfoList'] if isinstance(z,dict)]
                          if len(sections)<3:return 'inspection data incomplete'
                          safe={k:r.get(k) for k in ('vehicleName','modelYear','displayMileageDesc','oilType','sweptVolumeDesc','transmissionType','bodyColor','currentCity','showPrice','unitStr','starCondition','starFacade','starInterior','starSkeleton','starElectric','vehicleCategory','brand','brandSeries','manufacturer','driveModel','category')}
                          desc=t.split('Condition Details',1)[1].split('Basic Configuration',1)[0].strip()
                          if not desc:return 'report blank'
                          return dict(id=ident,fields=safe,description=desc,inspection=sections,features=info.get('featureItemList',[]),source=u,sha256=hs,photo_urls=selected,price_type='public listing price as displayed, not verified sold price',visual_review_required=True),pictures
                  except Exception as e:return type(e).__name__+': '+str(e)[:120]
              browser.close()
              import time
              # Each worker uses its own Playwright instance; no sharing browser objects across threads.
              with cf.ThreadPoolExecutor(max_workers=5) as pool:
                  for offset in range(0,len(eligible),10):
                      tasks=[pool.submit(examine,i,r) for i,r in eligible[offset:offset+10]]
                      for task in tasks:
                          item=task.result()
                          if isinstance(item,str):
                              errors[item]+=1
                              if sum(errors.values())<=8:print('Rejected',item,flush=True)
                              continue
                          row,pics=item
                          if any(h in hashes for h in row['sha256']):continue
                          if len(results)>=50:continue
                          hashes.update(row['sha256']);results.append(row)
                          for i,im in enumerate(pics):
                              im.thumbnail((1200,900));im.save(root/(row['id']+'-'+str(i+1)+'.jpg'),quality=88)
                          if len(results)%5==0:print('Collected',len(results),flush=True)
                      (root/'manifest.json').write_text(json.dumps({'count':len(results),'records':results,'errors':dict(errors)},ensure_ascii=False,indent=2))
                      if len(results)>=50:break
              (root/'manifest.json').write_text(json.dumps({'count':len(results),'records':results,'errors':dict(errors)},ensure_ascii=False,indent=2))
              print('Exact gallery and description count',len(results),dict(errors),flush=True)
              for off in range(0,len(results),10):
                  group=results[off:off+10]; sheet=Image.new('RGB',(1000,len(group)*225),'white');d=ImageDraw.Draw(sheet)
                  for j,row in enumerate(group):
                      y=j*225;d.text((5,y+3),row['id']+' '+row['fields']['vehicleName'][:90],fill='black')
                      for k in range(2):
                          im=Image.open(root/(row['id']+'-'+str(k+1)+'.jpg'));im.thumbnail((490,195));sheet.paste(im,(k*500,y+25))
                  sheet.save(root/f'contact-{off//10+1:02}.jpg',quality=88)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autostreets-review
          path: autostreets-review/
          retention-days: 7
