name: Release owner-reviewed five Honda ATP references
on:
  push:
    branches: ['release/honda-atp5-20261126']
    paths: ['.github/workflows/release-atp-honda5.yml']
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: honda-full-sheet-review
          run-id: 45813002900
          github-token: ${{ github.token }}
          path: /tmp/honda5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/render_atp_honda5.py /tmp/honda5
      - run: python scripts/build_static_public.py
      - name: Verify five reviewed examples and mobile images
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
          python -m http.server 8765 --directory render-public >/tmp/honda5-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          from pathlib import Path
          report=json.loads(Path("render-public/data/model-statistics-coverage.json").read_text())
          assert report["honda5_reference_cards"]+len(report["honda5_existing_lots"])==5
          assert len(report["models"])==144
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for w in (390,1280):
                  page=browser.new_page(viewport={"width":w,"height":844})
                  for ident in ("japan-honda-freed-spike","japan-honda-stepwgn"):
                      assert page.goto("http://127.0.0.1:8765/models/"+ident+".html").ok
                      for img in page.locator("[data-model-reference-id^='atp-honda5-'] img").all():
                          img.scroll_into_view_if_needed()
                          img.evaluate("(el) => el.decode()")
                          assert img.evaluate("(el) => el.naturalWidth > 0")
                  page.close()
              browser.close()
          PY
      - name: Commit only approved media and publish checked source
        run: |
          git config user.name "PapAuto release"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/seo-reference/atp-honda5-20261126
          git commit -m "Add exact fifteen owner-reviewed Honda ATP media files"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "ba2f9873e392e8b4ed01f4f601401d5a06169f39"
          git push origin HEAD:main
