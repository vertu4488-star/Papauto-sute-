name: ATP final fifteen fresh candidate review
on:
  push:
    branches: ['review/japan75-final15-20261126']
    paths: ['.github/workflows/atp-japan-final15.yml']
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: japan75-phase1-preview
          run-id: 45816762874
          github-token: ${{ github.token }}
          path: /tmp/atp-first
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_static_public.py
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/research_atp_final15.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan75-final15-fresh-preview
          path: japan-final15-review/
          retention-days: 7
