name: Release reviewed 33 model references
on:
  push:
    branches:
      - release/seo-atp33-reviewed-20261126
    paths:
      - '.github/workflows/release-atp33-reviewed.yml'
concurrency:
  group: papauto-atp33-reviewed
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: atp-67-private-review
          run-id: 45786431418
          github-token: ${{ github.token }}
          path: /tmp/atp-originals
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/render_atp33_references.py /tmp/atp-originals
      - run: python scripts/build_static_public.py
      - name: Verify responsive reference pages in Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
          python -m http.server 8765 --directory render-public >/tmp/papauto-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width in (390,1280):
                  page=browser.new_page(viewport={"width":width,"height":844})
                  page.goto("http://127.0.0.1:8765/models/korea-hyundai-avante-elantra.html")
                  assert page.locator(".pa-model-atp-reference").count()==1
                  img=page.locator(".pa-model-cover img")
                  img.scroll_into_view_if_needed()
                  page.wait_for_function("document.querySelector('.pa-model-cover img').naturalWidth > 0")
                  assert page.locator(".pa-model-atp-reference").is_visible()
                  page.goto("http://127.0.0.1:8765/models-135.html")
                  assert page.locator(".pa-directory-card").count()==101
              browser.close()
          PY
      - name: Publish only validated release
        run: |
          git config user.name "PapAuto release"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/seo-reference/atp-20261126
          git commit -m "Add the exact 66 reviewed photos to 33 SEO reference cards"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "8bdec85596d1ef29d555c8b467b2b7901544bbab"
          git push origin HEAD:main
