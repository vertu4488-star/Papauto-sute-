name: PapAuto stage owner-approved Japan 549 (not live)
on:
  push:
    branches: ['review/japan-next30-549-20261121']
    paths: ['.github/workflows/papauto-japan-549-approved-staging.yml']
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch originals from exact verified auction archives (wave3)
        uses: actions/download-artifact@v4
        with:
          name: drom991-next30-japan-exact-lot-photos-and-sheets
          run-id: 44864961085
          github-token: ${{ github.token }}
          path: /tmp/papauto-japan549-source/14691820564
      - name: Fetch originals from exact verified auction archives (b6)
        uses: actions/download-artifact@v4
        with:
          name: japan-atp-b6-pages-review
          run-id: 44758942918
          github-token: ${{ github.token }}
          path: /tmp/papauto-japan549-source/14641252098
      - name: Install checks
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Stage only 30 owner-approved exact-source photos + full sheets
        run: python scripts/stage_japan_next30_549_approved.py
      - name: Run regular site build and baseline tests
        run: |
          python -m pip install -r requirements.txt
          python scripts/verify_publication_approval.py
          python scripts/build_content.py
          python scripts/build_static_public.py
          python -m unittest discover -s tests -v
          node --check gallery.js
      - name: Confirm public gallery unchanged and stage all approved images
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('research/owner-approved-japan-next30-549-staged-2026-11-21.json').read_text())
          gallery=json.loads(Path('render-public/data/gallery-lots.json').read_text())
          assert receipt['owner_approved_count']==30 and receipt['media_count']==90
          assert receipt['published'] is False
          assert len(gallery['lots'])==489
          assert all(len(r['staged_photos'])==2 and r['staged_auction_sheet'] for r in receipt['lots'])
          print('STAGED_549_BATCH_PASS: 30 selected, 90 media, live gallery code still 489')
          PY
      - name: Freeze checked photos and receipt in review branch ONLY
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/japan-549-staged-media research/owner-approved-japan-next30-549-staged-2026-11-21.json
          git commit -m "Stage 30 owner-approved Japan 549 originals; pending 519 approval (not published)"
          git push origin HEAD:review/japan-next30-549-20261121
