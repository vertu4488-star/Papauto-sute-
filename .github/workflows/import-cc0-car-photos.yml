name: Import approved CC0 real vehicle photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/approved-cc0-vehicle-sources.json"
      - "scripts/import_cc0_vehicle_images.py"
      - ".github/workflows/import-cc0-car-photos.yml"
permissions:
  contents: write
concurrency:
  group: papauto-catalog-writes
  cancel-in-progress: false
jobs:
  approved-cc0-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PapAuto
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python for image optimization
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image dependencies
        run: python -m pip install "Pillow>=10,<13" "requests>=2.31,<3"
      - name: Verify CC0 licenses and download real vehicle photographs
        run: python scripts/import_cc0_vehicle_images.py
      - name: Commit self-hosted images and provenance
        run: |
          git config user.name "papauto-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo/*.webp research/cc0-photo-provenance.json
          if git diff --cached --quiet; then
            echo "Images unchanged"
            exit 0
          fi
          git commit -m "Import verified CC0 real vehicle photographs for PapAuto catalog"
          # Other workflows also publish to main. Rebase instead of force-pushing
          # so licensed image provenance and concurrent site edits are preserved.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Catalog updates safely published"
              exit 0
            fi
            echo "Remote main advanced; refreshing before retry $attempt/5"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Concurrent edits conflict; refusing to overwrite changes"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish after five non-destructive attempts"
          exit 1
