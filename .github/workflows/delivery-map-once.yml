name: Validate approved delivery map
on:
  push:
    branches: [delivery-map-20261128]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate production bundle
        run: python scripts/build_static_public.py
