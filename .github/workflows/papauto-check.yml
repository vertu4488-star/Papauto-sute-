name: PAPAUTO predeploy checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "auction-archive*"
      - "archive-*.js"
      - "data/sold-lots.json"
      - "tests/**"
      - "api.py"
      - "app.js"
      - "account.js"
      - "voice-assistant.js"
      - "*.html"
      - "buyer-tools.*"
      - "content/**"
      - "scripts/build_content.py"
      - "tests/test_seo.py"
      - "sitemap.xml"
      - "robots.txt"
      - "privacy.html"
      - "auction-data.html"
      - "styles.css"
      - "marketplace.css"
      - "saved-searches.js"
      - "smart-search.js"
      - "japan-chassis-search.js"
      - "route-planner.js"
      - "mobile.css"
      - "premium-ui.css"
      - "catalog-premium.css"
      - "site-config.js"
      - ".github/workflows/papauto-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install API test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify content builder is reproducible
        run: |
          python scripts/build_content.py
          git diff --exit-code -- "*.html" sitemap.xml
      - name: Check new design assets and navigation wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          homepage = Path("index.html").read_text(encoding="utf-8")
          catalog = Path("catalog.html").read_text(encoding="utf-8")
          assert '/premium-ui.css?v=20261104' in homepage
          assert '/catalog-premium.css?v=20261104' in catalog
          assert catalog.index("/catalog-premium.css") > catalog.index("</style>")
          for name in ("premium-ui.css", "catalog-premium.css"):
              content = Path(name).read_text(encoding="utf-8")
              assert "prefers-reduced-motion" in content
              assert "@media" in content
          assert 'class="mobile-bottom-nav"' in homepage
          print("Responsive stylesheets and navigation hooks OK")
          PY
      - name: Check Python syntax
        run: python -m py_compile api.py tests/test_api_vehicle_search.py
      - name: Test live listing routing and safe fallback
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check account.js
          node --check marketplace-interactions.js
          node --check saved-searches.js
          node --check smart-search.js
          node --check japan-chassis-search.js
          node --check route-planner.js
          node --check voice-assistant.js
          node --check auction-archive.js
          node --check archive-core.js
          node --check archive-request.js
          node tests/test_archive.cjs
