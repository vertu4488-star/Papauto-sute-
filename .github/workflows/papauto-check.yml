name: PAPAUTO syntax checks

on:
  push:
    branches: [main]
    paths:
      - "api.py"
      - "app.js"
      - ".github/workflows/papauto-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Python syntax
        run: python -m py_compile api.py
      - name: Check browser JavaScript syntax
        run: node --check app.js
