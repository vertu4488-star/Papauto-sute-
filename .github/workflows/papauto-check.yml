name: PAPAUTO syntax and smoke checks

on:
  push:
    branches: [main]
    paths:
      - "api.py"
      - "app.js"
      - "index.html"
      - "auction-data.html"
      - "styles.css"
      - ".github/workflows/papauto-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Python syntax
        run: python -m py_compile api.py
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Wait for Render API deployment and test Japan source hub
        shell: bash
        run: |
          set -euo pipefail
          URL="https://papauto-leads.onrender.com/api/auction-statistics?country=japan&make=Toyota&model=RAV4&year_from=2019&year_to=2025"
          EXPECTED_VERSION="2026-10-30-r12"
          for attempt in $(seq 1 18); do
            if curl --silent --show-error --fail "$URL&probe=${GITHUB_RUN_ID}-${attempt}" -o /tmp/japan.json; then
              ACTUAL_VERSION=$(python -c 'import json; print(json.load(open("/tmp/japan.json",encoding="utf-8")).get("source_hub_version","missing"))')
              echo "Render API source hub version: $ACTUAL_VERSION"
              if [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ]; then
                break
              fi
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Render API did not deploy expected source hub version after 180 seconds"
              exit 1
            fi
            sleep 10
          done
          python - <<'PY'
          import json
          with open("/tmp/japan.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("data_type") == "source_hub", data
          assert data.get("source_hub_version") == "2026-10-30-r12", data
          assert len(data.get("sources", [])) >= 5, data
          assert data.get("sample_stats", {}).get("sample_count") == 9, data
          assert len(data.get("records", [])) == 9, data
          print("Japan source hub and RAV4 sample OK:", len(data["sources"]), "sources,", len(data["records"]), "sold sample lots")
          PY
      - name: Test Japan model-specific search links
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail "https://papauto-leads.onrender.com/api/auction-statistics?country=japan&make=Toyota&model=Prius&year_from=2018&year_to=2025" -o /tmp/prius.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/prius.json", encoding="utf-8"))
          assert data.get("source_hub_version") == "2026-10-30-r12", data
          assert data.get("sample_stats") is None, data
          links = data.get("model_search_links", [])
          assert len(links) >= 5, data
          banzai = next(x for x in links if x["name"].startswith("Banzai24"))
          assert "/TOYOTA/PRIUS?" in banzai["url"], banzai
          assert "yearStart=2018" in banzai["url"] and "yearEnd=2025" in banzai["url"], banzai
          carvector = next(x for x in links if x["name"].startswith("Carvector"))
          assert carvector["url"] == "https://carvector.com/stat/toyota/prius", carvector
          aleado = next(x for x in links if x["name"].startswith("Aleado — статистика"))
          assert "PRIUS.asp?company_id=9&name_id=718" in aleado["url"], aleado
          demo = next(x for x in links if x["name"].startswith("Aleado — бесплатная демо-база"))
          assert demo["url"] == "https://demo.aleado.com/auctions/?lang=ru", demo
          print("Prius model search links OK:", len(links), "sources incl. Aleado statistics and free demo")
          PY
      - name: Test Aleado manufacturer search
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail "https://papauto-leads.onrender.com/api/auction-statistics?country=japan&make=Honda&model=Fit&year_from=2018&year_to=2025" -o /tmp/honda.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/honda.json", encoding="utf-8"))
          links = data.get("model_search_links", [])
          aleado = next(x for x in links if x["name"].startswith("Aleado"))
          assert aleado["url"] == "https://aleado.com/autostat/FIT.asp?company_id=2&name_id=109", aleado
          carvector = next(x for x in links if x["name"].startswith("Carvector"))
          assert carvector["url"] == "https://carvector.com/stat/honda/fit", carvector
          print("Honda manufacturer archive link OK")
          PY
      - name: Test Russian model-name normalization
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --get "https://papauto-leads.onrender.com/api/auction-statistics" --data-urlencode "country=japan" --data-urlencode "make=Тойота" --data-urlencode "model=Рав4" --data-urlencode "year_from=2019" --data-urlencode "year_to=2025" -o /tmp/rav4-ru.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/rav4-ru.json", encoding="utf-8"))
          links = data.get("model_search_links", [])
          assert any(x["url"].startswith("https://carvector.com/stat/toyota/rav4") for x in links), links
          assert any("RAV4.asp?company_id=9&name_id=710" in x["url"] for x in links), links
          assert any("/TOYOTA/RAV4?" in x["url"] for x in links), links
          print("Russian make/model normalization OK")
          PY
      - name: Test Japan vehicle search fallback
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail "https://papauto-leads.onrender.com/api/vehicles?country=japan&make=Toyota&model=Prius&year_from=2018&year_to=2025" -o /tmp/japan-vehicles.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/japan-vehicles.json", encoding="utf-8"))
          assert data.get("data_type") == "external_search", data
          assert len(data.get("search_links", [])) >= 5, data
          print("Japan vehicle search fallback OK")
          PY
      - name: Test China source hub
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail "https://papauto-leads.onrender.com/api/auction-statistics?country=china&make=BYD&model=Song%20Plus&year_from=2020&year_to=2025" -o /tmp/china.json
          python - <<'PY'
          import json
          with open("/tmp/china.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("data_type") == "source_hub", data
          assert data.get("source_hub_version") == "2026-10-30-r12", data
          assert len(data.get("sources", [])) >= 5, data
          assert data.get("sample_stats") is None, data
          assert data.get("records") == [], data
          assert len(data.get("china_judicial_sample", [])) == 4, data
          assert len(data.get("china_market_sample", [])) == 3, data
          assert data["china_market_sample"][2].get("photo_example_url"), data
          print("China source hub OK:", len(data["sources"]), "sources,", len(data["china_market_sample"]), "TTPAI model samples incl. public photo link,", len(data["china_judicial_sample"]), "judicial examples")
          PY
