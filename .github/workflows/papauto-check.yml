name: PAPAUTO predeploy checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install API test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify content builder is reproducible
        run: |
          python scripts/build_content.py
          git diff --exit-code -- "*.html" sitemap.xml
      - name: Verify static bundle contains no application source or credentials
        run: |
          python scripts/build_static_public.py
          python - <<'PY'
          from pathlib import Path
          public = Path('render-public')
          paths = {f.relative_to(public).as_posix() for f in public.rglob('*') if f.is_file()}
          assert {'index.html','catalog.html','app.js','styles.css',
                  'robots.txt','sitemap.xml','assets/papauto-logo.svg'}.issubset(paths)
          from scripts.build_static_public import TOMBSTONE, PROTECTED_DIRS, PROTECTED_SUFFIXES, PROTECTED_NAMES
          safe_text = {'robots.txt', 'ads.txt', 'security.txt'}
          sensitive = {path for path in paths if path not in safe_text and (
                       path.endswith(tuple(PROTECTED_SUFFIXES))
                       or path.split('/')[0] in PROTECTED_DIRS
                       or Path(path).name in PROTECTED_NAMES
                       or Path(path).name.startswith('.env'))}
          assert {'api.py', 'china_stats.py', 'korea_auction_stats.py',
                  'requirements.txt', 'README.md'}.issubset(sensitive), 'Missing protective tombstones'
          for path in sensitive:
              assert (public / path).read_bytes() == TOMBSTONE, f'Unsafe published file: {path}'
          print(f'Static publish bundle contains {len(paths) - len(sensitive)} public files and {len(sensitive)} safe tombstones')
          PY
      - name: Check new design assets and navigation wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          homepage = Path("index.html").read_text(encoding="utf-8")
          catalog = Path("catalog.html").read_text(encoding="utf-8")
          assert '/premium-ui.css?v=20261104' in homepage
          assert '/catalog-premium.css?v=20261104' in catalog
          assert catalog.index("/catalog-premium.css") > catalog.index("</style>")
          for name in ("premium-ui.css", "catalog-premium.css"):
              content = Path(name).read_text(encoding="utf-8")
              assert "prefers-reduced-motion" in content
              assert "@media" in content
          assert 'class="mobile-bottom-nav"' in homepage
          print("Responsive stylesheets and navigation hooks OK")
          PY
      - name: Check Python syntax
        run: python -m py_compile api.py tests/test_api_vehicle_search.py
      - name: Test live listing routing and safe fallback
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          node --check metrika.js
          node --check app.js
          node --check account.js
          node --check marketplace-interactions.js
          node --check saved-searches.js
          node --check smart-search.js
          node --check japan-chassis-search.js
          node --check route-planner.js
          node --check voice-assistant.js
          node --check auction-archive.js
          node --check archive-core.js
          node --check archive-request.js
          node tests/test_archive.cjs
