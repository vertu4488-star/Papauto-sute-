name: Drom 991 gap — exact Japan auction media research
on:
  push:
    branches: ['research/drom991-gap-audit-20261121']
    paths: ['.github/workflows/drom991-targeted-source-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - name: Find exact missing model-year lots with two photos and original sheets
        run: python scripts/research_drom991_targeted_gap.py
      - uses: actions/upload-artifact@v4
        with:
          name: drom991-gap-photo-sheet-review
          path: drom-gap-review/
          retention-days: 60
