name: PapAuto China missing model-year source photo review
on:
  push:
    branches: ['review/drom991-exact-year-gaps-20261121']
    paths: ['.github/workflows/drom991-china-gap-research.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4 pillow
      - name: Identify exact unlisted supplier photos and create internal visual contact sheets
        run: python scripts/research_drom991_china_gap_supplier_20261121.py
      - uses: actions/upload-artifact@v4
        with:
          name: drom991-china-gap-photo-review
          path: china-gap-review/
          retention-days: 30
