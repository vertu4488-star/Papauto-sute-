name: ATP 67 model gap private media review
on:
  push:
    branches: ['review/atp-67-model-gaps-20261126']
    paths: ['.github/workflows/atp-67-private-review.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/research_atp_67_model_gaps_20261126.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atp-67-private-review
          path: atp-67-private-review/
          retention-days: 7
