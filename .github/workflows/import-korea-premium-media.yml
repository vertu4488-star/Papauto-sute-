name: Pin verified Korean premium listing photographs
on:
  push:
    branches: [main]
    paths:
      - "research/premium-korea-media-sources-2026-11-12.json"
      - "scripts/import_korea_premium_media.py"
      - ".github/workflows/import-korea-premium-media.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: papauto-catalog-writes
  cancel-in-progress: false
jobs:
  import-korean-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "Pillow>=10,<13"
      - name: Download and validate photos belonging to their exact listing IDs
        run: python scripts/import_korea_premium_media.py
      - name: Commit locally hosted verified images
        run: |
          git config user.name "papauto-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/premium-auctions/*.webp
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Pin original Korean premium listing photos for three verified cases"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          exit 1
