name: Japan ATP extra indoor sourcing review
on:
  push:
    branches: ['review/japan-atp-next30-b2-20261120']
    paths: ['.github/workflows/japan-atp-b2-extra-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/research_japan_atp_b2_extra.py
      - uses: actions/upload-artifact@v4
        with:
          name: japan-atp-b2-extra-review
          path: atp-review/
