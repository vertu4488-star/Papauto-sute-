name: Import public Japanese auction statistics
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import_public_japan_stats.py
      - .github/workflows/import-japan-stats.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - run: python scripts/import_public_japan_stats.py
      - name: Commit only verified results
        run: |
          if test -f data/jp-direct-sold.json; then
            git config user.name "papauto-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/jp-direct-sold.json
            git diff --cached --quiet || (git commit -m "Import 500 sourced Japanese auction sales" && git push)
          fi
