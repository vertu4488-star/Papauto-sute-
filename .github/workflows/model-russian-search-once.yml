name: Improve Russian model search wording
on:
  push:
    branches: [seo-model-russian-20261128]
    paths: ['scripts/model_russian_search.py']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update and validate existing model pages
        run: |
          git fetch origin main --depth=1
          git restore --source=FETCH_HEAD -- models
          python scripts/model_russian_search.py
          python scripts/model_russian_search.py --check
          python scripts/build_static_public.py
      - name: Commit validated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models
          git diff --cached --quiet && exit 0
          git commit -m 'Improve mixed Russian and Latin model price questions'
          git push origin HEAD:seo-model-russian-20261128
