name: Verify public photo wording
on:
  push:
    branches: [public-photo-labels-20261128]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate production output and auction safeguards
        run: python scripts/build_static_public.py
