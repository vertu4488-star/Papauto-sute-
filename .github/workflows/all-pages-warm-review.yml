name: PapAuto all-pages warm theme review
on:
  push:
    branches:
      - design/unified-warm-all-pages-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warm-theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check builder and browser syntax
        run: |
          python -m py_compile scripts/build_static_public.py tests/test_site_warm_theme.py
          node --check scripts/qa_warm_site_browser.cjs
      - name: Build safe public site with warm theme
        run: python scripts/build_static_public.py
      - name: Test no cold CSS and real auction media retained
        run: python -m unittest discover -s tests -p 'test_site_warm_theme.py' -v
      - name: Install Chromium browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify actual page colors, cards, gallery and lot sheets on 390px and desktop
        run: |
          python -m http.server 8765 -d render-public > /tmp/papauto-warm-http.log 2>&1 &
          node scripts/qa_warm_site_browser.cjs
          node scripts/qa_gallery_browser.cjs
          node scripts/qa_premium_light_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: papauto-all-pages-warm-visual-review
          path: |
            warm-gallery-mobile.png
            warm-gallery-desktop.png
            warm-lot-mobile.png
            warm-lot-desktop.png
            gallery-mobile.png
            gallery-desktop.png
          if-no-files-found: ignore
