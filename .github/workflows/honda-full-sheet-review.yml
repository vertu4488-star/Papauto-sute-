name: Honda full sheet photo review
on:
  push:
    branches: ['review/honda-two-full-sheets-20261126']
    paths: ['.github/workflows/honda-full-sheet-review.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/research_honda_full_sheets_20261126.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: honda-full-sheet-review
          path: honda-review/
          retention-days: 7
