name: PapAuto China 30 supplier photo intake
on:
  push:
    branches: ['research/drom991-japan-china-30x30-20261121']
    paths: ['.github/workflows/drom991-china30-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  china:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/research_china_supplier_new30.py
      - uses: actions/upload-artifact@v4
        with:
          name: drom991-china-30-supplier-photo-review
          path: drom991-china-new30-review/
          retention-days: 60
