name: PapAuto release owner-approved Japan 639 exact original lots
on:
  push:
    branches: ['release/papauto-japan-owner-approved-639-20261121']
    paths: ['.github/workflows/papauto-japan-639-owner-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish-approved-639:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download source archive of exact original lot photos and auction sheets (b6)
        uses: actions/download-artifact@v4
        with:
          name: japan-atp-b6-pages-review
          run-id: 44758942918
          github-token: ${{ github.token }}
          path: /tmp/papauto-japan639-source/14641252098
      - name: Download source archive of exact original lot photos and auction sheets (wave3)
        uses: actions/download-artifact@v4
        with:
          name: drom991-next30-japan-exact-lot-photos-and-sheets
          run-id: 44864961085
          github-token: ${{ github.token }}
          path: /tmp/papauto-japan639-source/14691820564
      - name: Install project and image-validation dependencies
        run: python -m pip install -r requirements.txt pillow
      - name: Verify all originals, deduplicate against 577 approvals, freeze exact owner-approved 639 batch
        run: python scripts/release_japan_next30_639_owner_approved.py
      - name: Build release and verify unchanged media policy, all 639 lot pages and tests
        run: |
          python scripts/verify_publication_approval.py
          python scripts/build_content.py
          python scripts/build_static_public.py
          python -m unittest discover -s tests -v
          node --check gallery.js
          node tests/test_survey_all_gallery_lots.cjs
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          public=Path("render-public")
          data=json.loads((public/"data/gallery-lots.json").read_text(encoding="utf-8"))
          receipt=json.loads(Path("research/owner-approved-japan-next30-639-2026-11-21.json").read_text(encoding="utf-8"))
          rows=data["lots"]
          assert data["lot_count"]==len(rows)==639
          assert len({r["id"] for r in rows})==639
          assert all((public/"lots"/(r["id"]+".html")).is_file() for r in rows), "One or more of 639 exact lot pages is missing"
          new=[r for r in rows if r["id"].startswith("japan-next30-639-20261121-")]
          assert len(new)==len(receipt["lots"])==30
          prior=[r for r in rows if r["id"].startswith("japan-next30-609-20261121-")]
          assert len(prior)==30
          unique=set();hashes=set()
          for r in rows:
              lot=(r["market"],r["auction"].lower().replace(" ",""),str(r["auction_date"]),str(r["lot_number"]).lstrip("0"))
              assert lot not in unique,("duplicate auction lot",lot)
              unique.add(lot)
          for record in receipt["lots"]:
              row=next(r for r in rows if r["id"]==record["id"])
              assert row["rights_confirmed"] is False and row["status"]=="reference_only"
              assert "Автомобиль не в наличии" in row["description"] and len(row["photos"])==2
              assert row["inspection_kind"]=="Аукционный лист"
              assert row["photos"]==record["photos"] and row["inspection_image"]==record["auction_sheet"]
              for p,sha in zip(record["photos"]+[record["auction_sheet"]],record["media_sha256"]):
                  file=public/p.lstrip("/")
                  assert file.is_file() and len(file.read_bytes())>3000
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==sha
                  assert sha not in hashes
                  hashes.add(sha)
              detail=public/"lots"/(row["id"]+".html")
              assert detail.is_file() and row["inspection_image"] in detail.read_text(encoding="utf-8")
          assert len(hashes)==90
          print("PAPAUTO_639_RELEASE_VERIFY_OK: 639 unique lots; 30 newly approved; 90 exact source-backed photos/sheets; all individual detail pages")
          PY
      - name: Browser QA mobile 320 and 390 px, desktop 1440 px, all new original photos and full sheets
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          python -m http.server 8765 --directory render-public >/tmp/papauto-639-server.log 2>&1 &
          node scripts/qa_gallery_browser.cjs
          node scripts/qa_all_auction_lot_pages.cjs
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [320,390,1440]){
              const page=await browser.newPage({viewport:{width,height:844}});
              await page.goto('http://127.0.0.1:8765/gallery.html',{waitUntil:'load'});
              const all=await page.evaluate(async()=>await(await fetch('/data/gallery-lots.json')).json());
              if(all.lot_count!==639||all.lots.length!==639)throw Error('Wrong catalogue count '+all.lots.length);
              const newlyApproved=all.lots.filter(l=>l.id.startsWith('japan-next30-639-20261121-'));
              if(newlyApproved.length!==30)throw Error('Missing new owner-approved lot');
              for(const lot of newlyApproved){
                for(const source of [...lot.photos,lot.inspection_image]){
                  await page.evaluate(async u=>{const img=new Image();img.src=u;await img.decode();if(!img.naturalWidth||!img.naturalHeight)throw Error('Missing source image '+u)},source);
                }
              }
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              if(overflow>2)throw Error('Mobile/desktop horizontal overflow at '+width+': '+overflow);
              await page.close();
            }
            await browser.close();
            console.log('PAPAUTO_639_MOBILE_IMAGE_QA_OK: 30 new cards / 90 original images / 320px,390px,1440px');
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
      - name: Commit strict owner-approved 639 release to release branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/AUCTION_ONLY_GALLERY.md scripts/compile_auction_gallery.py scripts/build_static_public.py scripts/verify_publication_approval.py scripts/publish_lot_search.py tests/test_site_warm_theme.py tests/test_auction_only_images_policy.py research/owner-approved-japan-next30-639-2026-11-21.json assets/auction/approved/japan-next30-639-20261121-*.jpg sitemap.xml
          git commit -m "PapAuto: publish exact 30 owner-approved Japanese archive cards (639)"
          git push origin HEAD:release/papauto-japan-owner-approved-639-20261121
