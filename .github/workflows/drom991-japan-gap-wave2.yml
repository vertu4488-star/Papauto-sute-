name: Drom 991 Japan missing-model wave 2 source photo review
on:
  push:
    branches: ['review/drom991-japan-gap-wave2-20261121']
    paths: ['.github/workflows/drom991-japan-gap-wave2.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - name: Verify exact source lots, gallery duplicates, photos and sheets
        run: python scripts/research_drom991_japan_gap_wave2.py
      - uses: actions/upload-artifact@v4
        with:
          name: drom991-japan-wave2-original-photo-sheet-review
          path: drom-gap-wave2-review/
          retention-days: 40
