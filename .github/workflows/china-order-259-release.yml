name: China 259-card owner-approved release
on:
  push:
    branches: ['release/china-order-259-20261120']
    paths: ['.github/workflows/china-order-259-release.yml']
permissions:
  actions: read
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: goldenlane-final9-chery-review
          run-id: 44705143495
          github-token: ${{ github.token }}
          path: /tmp/china259/14614128532
      - uses: actions/download-artifact@v4
        with:
          name: goldenlane-final9-kia-review
          run-id: 44705308204
          github-token: ${{ github.token }}
          path: /tmp/china259/14614333156
      - uses: actions/download-artifact@v4
        with:
          name: goldenlane-final9-review
          run-id: 44704929595
          github-token: ${{ github.token }}
          path: /tmp/china259/14615040428
      - uses: actions/download-artifact@v4
        with:
          name: goldenlane-160hp-third-review
          run-id: 44703941117
          github-token: ${{ github.token }}
          path: /tmp/china259/14613198955
      - uses: actions/download-artifact@v4
        with:
          name: goldenlane-160hp-extra-review
          run-id: 44703760612
          github-token: ${{ github.token }}
          path: /tmp/china259/14614495422
      - uses: actions/download-artifact@v4
        with:
          name: goldenlane-160hp-review
          run-id: 44703549078
          github-token: ${{ github.token }}
          path: /tmp/china259/14613827343
      - uses: actions/download-artifact@v4
        with:
          name: china-160hp-ez-review
          run-id: 44699371077
          github-token: ${{ github.token }}
          path: /tmp/china259/14611574333
      - name: Assemble exact approved archive images and validate
        run: |
          python scripts/prepare_china_order_next30.py
          python scripts/build_content.py
          python scripts/build_static_public.py
          python -m unittest discover -s tests -p 'test_auction*policy.py'
          python - <<'PY'
          from pathlib import Path
          from scripts.verify_china_order_release import verify
          assert len(verify(Path('render-public')))==259
          PY
      - name: Mobile and desktop checks
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          python -m http.server 8765 --directory render-public >/tmp/china-server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});for(const width of [390,1440]){const p=await b.newPage({viewport:{width,height:844}});await p.goto('http://localhost:8765/china-order.html');if(await p.locator('.cn-example').count()!==259)throw Error('card count');if(await p.locator('.cn-example[data-power]').count()!==90)throw Error('power count');const powers=await p.locator('.cn-example[data-power]').evaluateAll(es=>es.map(e=>Number(e.dataset.power)));if(powers.some(x=>x<=0||x>160))throw Error('power range');const images=p.locator('img[src*="owner-20261120-next30/"]');if(await images.count()!==30)throw Error('new photos count');for(const im of await images.all()){await im.evaluate(async e=>{e.loading='eager';await e.decode();if(e.naturalWidth<300)throw Error('image invalid')})}await p.fill('#cn-search','Nissan Sylphy');if(await p.locator('.cn-example:visible').count()<1)throw Error('search');await p.fill('#cn-search','');await p.selectOption('#cn-origin','korea');if(await p.locator('.cn-example:visible:not([data-origin="korea"])').count()!==0)throw Error('filter');await p.selectOption('#cn-origin','all');if(await p.locator('.cn-example:visible').count()!==259)throw Error('reset');if(await p.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))throw Error('overflow');await p.close()}await b.close();console.log('259 cards with thirty decoded new photos passed mobile and desktop')})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit verified release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/china-order/owner-20261120-next30 china-order.html china.html research/owner-approved-china-supplier-next30-2026-11-20.json research/CHINA_SUPPLIER_SOURCE_REGISTER.md scripts/verify_china_order_release.py AGENTS.md docs/AUCTION_ONLY_GALLERY.md sitemap.xml
          git commit -m "Append thirty approved China supplier cards with exact local photos"
          git push origin HEAD:release/china-order-259-20261120
