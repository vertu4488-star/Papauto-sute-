name: ATP Japan 13 exact model review
on:
  push:
    branches: ['review/atp-japan13-20261126']
    paths: ['.github/workflows/atp-japan13-review.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/research_atp_japan13_20261126.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atp-japan13-review
          path: atp-japan13-review/
          retention-days: 7
