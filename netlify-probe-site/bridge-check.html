<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PapAuto — проверка API заявок без отправки</title><style>body{max-width:670px;margin:2rem auto;padding:1rem;font:16px/1.5 system-ui;color:#172c43}button{background:#1760a8;color:#fff;border:0;border-radius:12px;padding:14px 20px;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;background:#f2f5fa;border-radius:12px}</style></head><body><h1>Проверка API заявок PapAuto</h1><p>Безопасный тест отправляет заведомо неправильные данные. Сервер должен отклонить их до сохранения в Neon или уведомления в Telegram.</p><button id="btn">Проверить защиту API</button><pre id="log">Ожидает запуска.</pre><script>document.getElementById('btn').onclick=async()=>{const e=document.getElementById('log');e.textContent='Выполняется...';try{const r=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'omit',body:JSON.stringify({kind:'network-check'})});const d=await r.json();e.textContent='HTTP '+r.status+'\n'+JSON.stringify(d); }catch(err){e.textContent='Ошибка сети: '+String(err)}};</script></body></html>
