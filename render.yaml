# Proposed adoption of the EXISTING PapAuto static site.
# Do not apply before reviewing the Render Blueprint plan.
# The API service papauto-leads is intentionally not managed here.
services:
  - type: web
    name: papauto-site
    runtime: static
    repo: https://github.com/vertu4488-star/Papauto-sute-
    branch: main
    buildCommand: python scripts/build_static_public.py
    staticPublishPath: ./render-public
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - "*.html"
        - "*.css"
        - "*.js"
        - "*.xml"
        - "*.txt"
        - "assets/**"
        - "data/**"
        - "content/**"
        - "scripts/build_content.py"
        - "scripts/build_static_public.py"

  # Existing FastAPI backend with Neon persistence and Telegram notifications.
  # No secrets are defined in source; existing Render environment is preserved.
  - type: web
    name: papauto-leads
    runtime: python
    repo: https://github.com/vertu4488-star/Papauto-sute-
    branch: main
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - "*.py"
        - "requirements.txt"
        - "data/**"
        - "content/**"
